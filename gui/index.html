<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>配置表部分导出工具</title>
<style>
  :root{
    --bg:#f4f6f9; --panel:#ffffff; --border:#d8dee6; --text:#1f2933;
    --primary:#2563eb; --primary-h:#1d4ed8; --accent:#10b981; --danger:#ef4444;
    --tag-client:#2563eb; --tag-server:#16a34a; --tag-both:#9aa5b1;
    --muted:#6b7280; --hover:#eef4ff; --sel:#dbeafe;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif;
    background:var(--bg); color:var(--text); font-size:14px;
    display:flex; flex-direction:column; overflow:hidden;
  }
  header{
    display:flex; flex-direction:column; gap:10px;
    padding:12px 16px; background:var(--panel); border-bottom:1px solid var(--border);
  }
  .header-row{display:flex; align-items:center; gap:14px; flex-wrap:wrap;}
  header h1{font-size:16px; font-weight:600; margin-right:auto; white-space:nowrap;}
  .bar{display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
  .bar .lbl{font-size:13px; color:var(--muted); white-space:nowrap;}
  .bar input{
    flex:1; min-width:220px; padding:7px 10px; border:1px solid var(--border);
    border-radius:6px; font-size:13px; outline:none;
    font-family:Consolas,"Cascadia Mono",monospace;
  }
  .bar input:focus{border-color:var(--primary);}
  .work-dir{
    flex:1; min-width:220px; padding:7px 10px; background:#eef2f8;
    border:1px solid var(--border); border-radius:6px; font-size:12px; color:var(--muted);
    font-family:Consolas,"Cascadia Mono",monospace;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .ck{display:inline-flex; align-items:center; gap:5px; font-size:13px; color:var(--muted); white-space:nowrap; cursor:pointer; user-select:none;}
  .ck input{accent-color:var(--primary);}
  .tab-bar{
    display:flex; align-items:flex-end; gap:4px;
    border-bottom:1px solid var(--border);
    overflow-x:auto; overflow-y:hidden;
  }
  .tab{
    display:inline-flex; align-items:center; gap:6px; max-width:200px;
    padding:6px 12px; flex:0 0 auto;
    border:1px solid var(--border); border-bottom:none;
    border-radius:8px 8px 0 0;
    background:#eef1f5; color:var(--muted);
    cursor:pointer; font-size:13px; user-select:none; white-space:nowrap;
    margin-bottom:-1px;
  }
  .tab .tab-name{overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .tab:hover{background:#e2e8f0; color:var(--text);}
  .tab.active{
    background:var(--panel); color:var(--primary); font-weight:600;
    border-bottom:1px solid var(--panel);
  }
  .tab .tab-close{
    border:none; background:none; cursor:pointer; color:var(--muted);
    font-size:14px; line-height:1; padding:0 2px; border-radius:3px;
  }
  .tab .tab-close:hover{background:var(--danger); color:#fff;}
  .tab-add{
    flex:0 0 auto; border:none; background:transparent; color:var(--muted);
    font-size:18px; cursor:pointer; padding:2px 8px; margin-bottom:3px;
    line-height:1; border-radius:6px;
  }
  .tab-add:hover{background:var(--hover); color:var(--primary);}
  .mode-group{display:flex; gap:8px; align-items:center;}
  .mode-group label{
    display:inline-flex; align-items:center; gap:5px; padding:6px 12px;
    border:1px solid var(--border); border-radius:6px; cursor:pointer;
    background:#fff; user-select:none; transition:.15s;
  }
  .mode-group label:hover{border-color:var(--primary);}
  .mode-group input{accent-color:var(--primary);}
  .mode-group label.on{border-color:var(--primary); background:var(--hover);}
  .btn{
    border:none; border-radius:6px; padding:8px 16px; cursor:pointer;
    font-size:14px; font-weight:500; transition:.15s; white-space:nowrap;
  }
  .btn-primary{background:var(--primary); color:#fff;}
  .btn-primary:hover{background:var(--primary-h);}
  .btn-primary:disabled{background:#b6c4e0; cursor:not-allowed;}
  .btn-accent{background:var(--accent); color:#fff;}
  .btn-accent:hover{background:#0ea371;}
  .btn-accent:disabled{background:#a7d9c5; cursor:not-allowed;}
  .btn-ghost{background:#fff; border:1px solid var(--border); color:var(--text);}
  .btn-ghost:hover{border-color:var(--primary); color:var(--primary);}
  main{
    flex:1; display:flex; gap:12px; padding:12px 16px; min-height:0;
  }
  .col{display:flex; flex-direction:column; background:var(--panel); border:1px solid var(--border); border-radius:8px; overflow:hidden;}
  .col-left{flex:0 0 44%; min-width:200px;}
  .col-right{flex:1 1 auto; min-width:200px;}
  .divider{
    flex:0 0 7px; cursor:col-resize;
    display:flex; align-items:stretch;
  }
  .divider::before{
    content:''; flex:1; margin:0 3px; border-radius:2px;
    background:var(--border); transition:background .15s;
  }
  .divider:hover::before{background:var(--primary);}
  .col-mid{flex:0 0 auto; display:flex; flex-direction:column; justify-content:center; gap:10px; padding:0 4px;}
  .col-head{
    display:flex; align-items:center; gap:8px; padding:10px 12px;
    border-bottom:1px solid var(--border); background:#fafbfc;
  }
  .col-head .title{font-weight:600; white-space:nowrap;}
  .col-head .count{color:var(--muted); font-size:12px; background:#eef1f5; border-radius:10px; padding:2px 8px;}
  .search{flex:1; min-width:80px;}
  .search input{
    width:100%; padding:6px 10px; border:1px solid var(--border); border-radius:6px;
    font-size:13px; outline:none;
  }
  .search input:focus{border-color:var(--primary);}
  .list{flex:1; overflow-y:auto; padding:6px;}
  .item{
    display:flex; align-items:center; gap:8px; padding:6px 8px;
    border-radius:6px; cursor:pointer; user-select:none; border:1px solid transparent;
  }
  .item:hover{background:var(--hover);}
  .item.selected{background:var(--sel); border-color:var(--primary);}
  .item .name{font-family:Consolas,"Cascadia Mono",monospace; font-size:13px; white-space:nowrap;}
  .item .desc{color:var(--muted); font-size:12px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .tag{
    font-size:10px; font-weight:600; padding:1px 6px; border-radius:8px;
    color:#fff; flex:0 0 auto; letter-spacing:.3px;
  }
  .tag.client{background:var(--tag-client);}
  .tag.server{background:var(--tag-server);}
  .tag.both{background:var(--tag-both);}
  .arrow{
    width:36px; height:36px; border-radius:8px; border:1px solid var(--border);
    background:#fff; cursor:pointer; font-size:16px; color:var(--muted); transition:.15s;
  }
  .arrow:hover{border-color:var(--primary); color:var(--primary); background:var(--hover);}
  .arrow:disabled{opacity:.35; cursor:not-allowed;}
  .empty{color:var(--muted); text-align:center; padding:24px 8px; font-size:13px;}
  footer{
    flex:0 0 190px; margin:0 16px 12px; background:#0f172a; border-radius:8px;
    display:flex; flex-direction:column; overflow:hidden;
  }
  .divider-h{
    flex:0 0 7px; cursor:row-resize; margin:0 16px;
    display:flex; align-items:center;
  }
  .divider-h::before{
    content:''; flex:1; height:2px; border-radius:2px;
    background:var(--border); transition:background .15s;
  }
  .divider-h:hover::before{background:var(--primary);}
  .log-head{
    display:flex; align-items:center; gap:8px; padding:6px 12px;
    color:#cbd5e1; font-size:12px; border-bottom:1px solid #1e293b;
  }
  .log-head button{margin-left:auto; background:#1e293b; color:#cbd5e1; border:none; border-radius:4px; padding:3px 10px; cursor:pointer; font-size:12px;}
  .log-head button:hover{background:#334155;}
  #log{
    flex:1; overflow-y:auto; padding:8px 12px; color:#a5f3fc;
    font-family:Consolas,"Cascadia Mono",monospace; font-size:12px; line-height:1.5; white-space:pre-wrap;
  }
  .log-line.time{color:#64748b;}
  .log-line.ok{color:#4ade80;}
  .log-line.err{color:#f87171;}
</style>
</head>
<body>
  <header>
    <div class="tab-bar" id="tabBar"></div>
    <div class="header-row">
      <h1>配置表部分导出工具</h1>
      <div class="mode-group" id="modeGroup">
        <label data-mode="cs"><input type="radio" name="mode" value="cs">两端</label>
        <label data-mode="c"><input type="radio" name="mode" value="c" checked>仅客户端</label>
        <label data-mode="s"><input type="radio" name="mode" value="s">仅服务端</label>
      </div>
      <button class="btn btn-ghost" id="btnRefresh">刷新列表</button>
      <button class="btn btn-primary" id="btnExport">开始导出</button>
      <button class="btn btn-accent" id="btnExportMove">导出并移动</button>
    </div>
    <div class="bar">
      <span class="lbl">工作目录</span>
      <span class="work-dir" id="workDir" title="">未设置工作目录</span>
      <button class="btn btn-ghost" id="btnSetWorkDir">添加页签…</button>
    </div>
    <div class="bar">
      <span class="lbl">项目路径</span>
      <input id="projectPath" type="text" placeholder="客户端项目根目录，如 C:\workspace\LDLProject\ldl-client" spellcheck="false">
      <button class="btn btn-ghost" id="btnBrowse">浏览…</button>
      <label class="ck"><input type="checkbox" id="chkMoveCs">移动 config.cs</label>
      <button class="btn btn-primary" id="btnMove">移动</button>
    </div>
  </header>

  <main id="mainArea">
    <div class="col col-left" id="leftCol">
      <div class="col-head">
        <span class="title">全部配置表</span>
        <span class="count" id="leftCount">0</span>
        <div class="search"><input id="search" type="text" placeholder="搜索表名 / 描述…"></div>
      </div>
      <div class="list" id="leftList"></div>
    </div>

    <div class="divider" id="divider" title="拖动调整左右宽度"></div>

    <div class="col-mid">
      <button class="arrow" id="btnAdd" title="添加选中到右侧">➜</button>
      <button class="arrow" id="btnAddAll" title="添加全部(当前筛选)">⏩</button>
      <button class="arrow" id="btnRemove" title="从右侧移除选中">⏪</button>
      <button class="arrow" id="btnClear" title="清空右侧">✖</button>
    </div>

    <div class="col col-right">
      <div class="col-head">
        <span class="title">待导出表</span>
        <span class="count" id="rightCount">0</span>
        <span class="search" style="visibility:hidden"><input type="text" disabled></span>
      </div>
      <div class="list" id="rightList"><div class="empty">点击左侧表名添加到这里</div></div>
    </div>
  </main>

  <div class="divider-h" id="dividerH" title="拖动调整日志栏高度"></div>

  <footer id="logPanel">
    <div class="log-head">
      <span>导出日志</span>
      <button id="btnClearLog">清空</button>
    </div>
    <div id="log"></div>
  </footer>

<script>
const $ = id => document.getElementById(id);

// ---------- 统一 API 层：pywebview 或 http ----------
const api = {
  async listTables(){
    if(window.pywebview && window.pywebview.api)
      return await window.pywebview.api.list_tables();
    const r = await fetch('/api/list');
    return await r.json();
  },
  async exportTables(names, mode){
    if(window.pywebview && window.pywebview.api)
      return await window.pywebview.api.export_tables(names, mode);
    const r = await fetch('/api/export', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({names, mode})
    });
    return await r.json();
  },
  async moveTables(names, projectPath, moveCs){
    if(window.pywebview && window.pywebview.api)
      return await window.pywebview.api.move_tables(names, projectPath, moveCs);
    const r = await fetch('/api/move', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({names, project_path: projectPath, move_cs: moveCs})
    });
    return await r.json();
  },
  async getConfig(){
    if(window.pywebview && window.pywebview.api)
      return await window.pywebview.api.get_config();
    const r = await fetch('/api/config');
    return await r.json();
  },
  async getWorkDir(){
    if(window.pywebview && window.pywebview.api)
      return await window.pywebview.api.get_work_dir();
    const r = await fetch('/api/work_dir');
    const j = await r.json();
    return j.work_dir || '';
  },
  async setWorkDir(path){
    if(window.pywebview && window.pywebview.api)
      return await window.pywebview.api.set_work_dir(path);
    const r = await fetch('/api/set_work_dir', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({path})
    });
    return await r.json();
  },
  async chooseDir(){
    if(window.pywebview && window.pywebview.api)
      return await window.pywebview.api.choose_dir() || '';
    const r = await fetch('/api/choose_dir', {method:'POST'});
    const j = await r.json();
    return j.path || '';
  },
  async getTabs(){
    if(window.pywebview && window.pywebview.api)
      return await window.pywebview.api.get_tabs();
    const r = await fetch('/api/tabs');
    return await r.json();
  },
  async removeTab(path){
    if(window.pywebview && window.pywebview.api)
      return await window.pywebview.api.remove_tab(path);
    const r = await fetch('/api/remove_tab', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({path})
    });
    return await r.json();
  },
  async checkUpdate(){
    if(window.pywebview && window.pywebview.api)
      return await window.pywebview.api.check_update();
    const r = await fetch('/api/check_update', {method:'POST'});
    return await r.json();
  },
  async downloadUpdate(url){
    if(window.pywebview && window.pywebview.api)
      return await window.pywebview.api.download_update(url);
    const r = await fetch('/api/download_update', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({url})
    });
    return await r.json();
  },
  async applyUpdate(){
    if(window.pywebview && window.pywebview.api)
      return await window.pywebview.api.apply_update();
    const r = await fetch('/api/apply_update', {method:'POST'});
    return await r.json();
  }
};

// ---------- 状态 ----------
let allTables = [];      // 左列表全部
let rightSet = [];       // 右侧待导出(有序, 存表名)
let selLeft = new Set(); // 左侧选中
let selRight = new Set();// 右侧选中
let mode = 'c';
let workDir = '';
let tabs = [];          // 页签列表(工作目录路径)
let tabStates = {};     // 每个页签独立状态 {path: {rightSet, selLeft, selRight, search}}

// ---------- 渲染 ----------
function renderWorkDir(){
  const el = $('workDir');
  if(workDir){ el.textContent = workDir; el.title = workDir; }
  else { el.textContent = '未设置工作目录（点右侧按钮选择配置表目录）'; el.title = ''; }
}
function tagBadge(tag){
  const cls = tag==='client' ? 'client' : (tag==='server' ? 'server' : 'both');
  const txt = tag==='client' ? 'C' : (tag==='server' ? 'S' : '两端');
  return `<span class="tag ${cls}">${txt}</span>`;
}
function itemHtml(t){
  return `<div class="item" data-name="${t.name}" data-tag="${t.tag||''}">
    ${tagBadge(t.tag)}<span class="name">${t.name}</span><span class="desc">${t.desc||''}</span>
  </div>`;
}
function renderLeft(){
  const kw = $('search').value.trim().toLowerCase();
  const list = $('leftList');
  let shown = allTables.filter(t =>
    !kw || t.name.toLowerCase().includes(kw) || (t.desc||'').toLowerCase().includes(kw));
  list.innerHTML = shown.length ? shown.map(itemHtml).join('') : '<div class="empty">无匹配结果</div>';
  $('leftCount').textContent = shown.length + ' / ' + allTables.length;
  list.querySelectorAll('.item').forEach(el=>{
    if(selLeft.has(el.dataset.name)) el.classList.add('selected');
  });
}
function renderRight(){
  const list = $('rightList');
  if(!rightSet.length){
    list.innerHTML = '<div class="empty">点击左侧表名添加到这里</div>';
  } else {
    const map = Object.fromEntries(allTables.map(t=>[t.name,t]));
    list.innerHTML = rightSet.map(n=>{
      const t = map[n] || {name:n, tag:'', desc:''};
      return itemHtml(t);
    }).join('');
    list.querySelectorAll('.item').forEach(el=>{
      if(selRight.has(el.dataset.name)) el.classList.add('selected');
    });
  }
  $('rightCount').textContent = rightSet.length;
}
function renderAll(){ renderLeft(); renderRight(); }

// ---------- 日志 ----------
function log(msg, cls){
  const el = $('log');
  const div = document.createElement('div');
  div.className = 'log-line' + (cls ? ' '+cls : '');
  const t = new Date().toTimeString().slice(0,8);
  div.textContent = `[${t}] ${msg}`;
  el.appendChild(div);
  el.scrollTop = el.scrollHeight;
}

// ---------- 交互 ----------
function bindList(listEl, selSet, onDblClick){
  let anchor = null; // 范围选择的锚点(上次单选/Ctrl点击的位置)

  listEl.addEventListener('click', e=>{
    const item = e.target.closest('.item');
    if(!item) return;
    const name = item.dataset.name;

    if(e.shiftKey && anchor){
      // Shift+点击：选中 anchor 到当前项之间的连续范围
      const items = [...listEl.querySelectorAll('.item')];
      const ia = items.findIndex(el => el.dataset.name === anchor);
      const ib = items.findIndex(el => el.dataset.name === name);
      if(ia !== -1 && ib !== -1){
        const from = Math.min(ia, ib), to = Math.max(ia, ib);
        selSet.clear();
        items.forEach(el => el.classList.remove('selected'));
        for(let i = from; i <= to; i++){
          selSet.add(items[i].dataset.name);
          items[i].classList.add('selected');
        }
      }
    } else if(e.ctrlKey || e.metaKey){
      // Ctrl+点击：切换单个选中
      if(selSet.has(name)){ selSet.delete(name); item.classList.remove('selected'); }
      else { selSet.add(name); item.classList.add('selected'); }
      anchor = name;
    } else {
      // 普通点击：单选
      listEl.querySelectorAll('.item.selected').forEach(x=>x.classList.remove('selected'));
      selSet.clear();
      selSet.add(name);
      item.classList.add('selected');
      anchor = name;
    }
  });
  listEl.addEventListener('dblclick', e=>{
    const item = e.target.closest('.item');
    if(item) onDblClick(item.dataset.name);
  });
}

function addSelected(){
  const names = selLeft.size ? [...selLeft] : [];
  if(!names.length){
    const first = $('leftList').querySelector('.item');
    if(first) names.push(first.dataset.name);
    else return;
  }
  names.forEach(n=>{ if(!rightSet.includes(n)) rightSet.push(n); });
  selLeft.clear();
  renderAll();
}
function addAllFiltered(){
  const kw = $('search').value.trim().toLowerCase();
  const shown = allTables.filter(t =>
    !kw || t.name.toLowerCase().includes(kw) || (t.desc||'').toLowerCase().includes(kw));
  shown.forEach(t=>{ if(!rightSet.includes(t.name)) rightSet.push(t.name); });
  selLeft.clear();
  renderAll();
}
function removeSelected(){
  const names = selRight.size ? [...selRight] : [];
  if(!names.length){
    const first = $('rightList').querySelector('.item');
    if(first) names.push(first.dataset.name);
    else return;
  }
  rightSet = rightSet.filter(n => !names.includes(n));
  selRight.clear();
  renderAll();
}
function clearRight(){ rightSet = []; selRight.clear(); renderAll(); }

// ---------- 导出 ----------
async function doExport(){
  if(!workDir){ log('请先设置工作目录', 'err'); return; }
  if(!rightSet.length){ log('待导出列表为空', 'err'); return; }
  const btn = $('btnExport');
  btn.disabled = true;
  log(`开始导出 ${rightSet.length} 张表 (${mode==='c'?'客户端':mode==='s'?'服务端':'两端'})...`);
  try{
    const res = await api.exportTables([...rightSet], mode);
    if(res && res.log){
      res.log.split(/\r?\n/).forEach(l=>{ if(l.trim()) log(l, res.ok ? '' : 'err'); });
    }
    if(res && res.ok) log('✅ 导出完成', 'ok');
    else log('❌ 导出失败', 'err');
  }catch(e){
    log('导出异常: ' + e, 'err');
  }finally{
    btn.disabled = false;
  }
}

async function doMove(){
  if(!workDir){ log('请先设置工作目录', 'err'); return; }
  const p = $('projectPath').value.trim();
  if(!p){ log('请先设置项目路径', 'err'); return; }
  if(!rightSet.length){ log('待导出列表为空', 'err'); return; }
  const btn = $('btnMove');
  btn.disabled = true;
  log(`开始移动 ${rightSet.length} 张表到客户端...`);
  try{
    const res = await api.moveTables([...rightSet], p, $('chkMoveCs').checked);
    if(res && res.log){
      res.log.split(/\r?\n/).forEach(l=>{ if(l.trim()) log(l, res.ok ? '' : 'err'); });
    }
    if(res && res.ok) log('✅ 移动完成', 'ok');
    else log('❌ 移动失败', 'err');
  }catch(e){
    log('移动异常: ' + e, 'err');
  }finally{
    btn.disabled = false;
  }
}

async function doExportAndMove(){
  if(!workDir){ log('请先设置工作目录', 'err'); return; }
  if(!rightSet.length){ log('待导出列表为空', 'err'); return; }
  const p = $('projectPath').value.trim();
  if(!p){ log('请先设置项目路径', 'err'); return; }
  const btn = $('btnExportMove');
  btn.disabled = true;
  log(`开始导出并移动 ${rightSet.length} 张表...`);
  try{
    const res = await api.exportTables([...rightSet], mode);
    if(res && res.log){
      res.log.split(/\r?\n/).forEach(l=>{ if(l.trim()) log(l, res.ok ? '' : 'err'); });
    }
    if(!res || !res.ok){
      log('❌ 导出失败，已跳过移动', 'err');
      return;
    }
    log('✅ 导出完成，开始移动...');
    const res2 = await api.moveTables([...rightSet], p, $('chkMoveCs').checked);
    if(res2 && res2.log){
      res2.log.split(/\r?\n/).forEach(l=>{ if(l.trim()) log(l, res2.ok ? '' : 'err'); });
    }
    if(res2 && res2.ok) log('✅ 导出并移动完成', 'ok');
    else log('❌ 移动失败', 'err');
  }catch(e){
    log('导出并移动异常: ' + e, 'err');
  }finally{
    btn.disabled = false;
  }
}

// ---------- 页签 ----------
function esc(s){
  return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}
function tabName(p){
  const parts = (p || '').replace(/[\\/]+$/, '').split(/[\\/]/);
  return parts[parts.length - 1] || p;
}
function saveCurrentState(){
  if(!workDir) return;
  tabStates[workDir] = {
    rightSet: [...rightSet],
    selLeft: [...selLeft],
    selRight: [...selRight],
    search: $('search').value
  };
  try{ localStorage.setItem('tabStates', JSON.stringify(tabStates)); }catch(e){}
}
function restoreState(path){
  const st = tabStates[path] || { rightSet: [], selLeft: [], selRight: [], search: '' };
  rightSet = (st.rightSet || []).slice();
  // 原地更新(不重新赋值)，保持 bindList 闭包持有的 Set 引用一致
  selLeft.clear();
  (st.selLeft || []).forEach(n => selLeft.add(n));
  selRight.clear();
  (st.selRight || []).forEach(n => selRight.add(n));
  $('search').value = st.search || '';
}
function renderTabs(){
  const bar = $('tabBar');
  bar.innerHTML = tabs.map(p=>{
    const active = p === workDir;
    return `<div class="tab${active?' active':''}" data-path="${esc(p)}" title="${esc(p)}">
      <span class="tab-name">${esc(tabName(p))}</span>
      <button class="tab-close" data-close="${esc(p)}" title="关闭页签">×</button>
    </div>`;
  }).join('') + '<button class="tab-add" id="btnAddTab" title="添加工作目录页签">+</button>';

  bar.querySelectorAll('.tab').forEach(tab=>{
    tab.addEventListener('click', ()=>{ switchTab(tab.dataset.path); });
  });
  bar.querySelectorAll('.tab-close').forEach(btn=>{
    btn.addEventListener('click', e=>{
      e.stopPropagation();
      removeTab(btn.dataset.close);
    });
  });
  const add = bar.querySelector('#btnAddTab');
  if(add) add.addEventListener('click', addTab);
}

async function switchTab(path){
  if(path === workDir) return;
  const res = await api.setWorkDir(path);
  if(res && res.ok){
    saveCurrentState();
    workDir = path;
    tabs = res.tabs || tabs;
    restoreState(path);
    renderWorkDir();
    renderTabs();
    await load();
  } else {
    log(res && res.log ? res.log : '切换页签失败', 'err');
  }
}

async function addTab(){
  const p = await api.chooseDir();
  if(!p) return;
  const res = await api.setWorkDir(p);
  if(res && res.ok){
    saveCurrentState();
    workDir = p;
    tabs = res.tabs || tabs;
    restoreState(p);
    renderWorkDir();
    renderTabs();
    await load();
    log(res.log, 'ok');
  } else {
    log(res && res.log ? res.log : '添加页签失败', 'err');
  }
}

async function removeTab(path){
  const res = await api.removeTab(path);
  if(res && res.ok){
    delete tabStates[path];
    try{ localStorage.setItem('tabStates', JSON.stringify(tabStates)); }catch(e){}
    tabs = res.tabs || [];
    workDir = res.active || '';
    restoreState(workDir);
    renderWorkDir();
    renderTabs();
    await load();
    log(res.log, 'ok');
  }
}

// ---------- 分栏拖动 ----------
function initDivider(){
  const main = $('mainArea'), left = $('leftCol'), dv = $('divider');
  let dragging = false;

  function setLeftPct(pct){
    pct = Math.max(20, Math.min(65, pct));
    left.style.flex = '0 0 ' + pct + '%';
    try{ localStorage.setItem('leftPct', pct); }catch(e){}
  }

  dv.addEventListener('mousedown', e=>{
    dragging = true;
    document.body.style.cursor = 'col-resize';
    document.body.style.userSelect = 'none';
    e.preventDefault();
  });
  document.addEventListener('mousemove', e=>{
    if(!dragging) return;
    const r = main.getBoundingClientRect();
    const pad = 16; // main 左右 padding
    const innerW = r.width - pad * 2;
    const pct = (e.clientX - r.left - pad) / innerW * 100;
    setLeftPct(pct);
  });
  document.addEventListener('mouseup', ()=>{
    dragging = false;
    document.body.style.cursor = '';
    document.body.style.userSelect = '';
  });

  const saved = parseFloat(localStorage.getItem('leftPct'));
  if(saved) setLeftPct(saved);
}

// ---------- 日志栏拖动 ----------
function initDividerH(){
  const foot = $('logPanel'), dv = $('dividerH');
  let dragging = false;

  function setFooterH(h){
    h = Math.max(80, Math.min(500, h));
    foot.style.flex = '0 0 ' + h + 'px';
    try{ localStorage.setItem('footerH', h); }catch(e){}
  }

  dv.addEventListener('mousedown', e=>{
    dragging = true;
    document.body.style.cursor = 'row-resize';
    document.body.style.userSelect = 'none';
    e.preventDefault();
  });
  document.addEventListener('mousemove', e=>{
    if(!dragging) return;
    const h = window.innerHeight - e.clientY - 12;
    setFooterH(h);
  });
  document.addEventListener('mouseup', ()=>{
    dragging = false;
    document.body.style.cursor = '';
    document.body.style.userSelect = '';
  });

  const saved = parseFloat(localStorage.getItem('footerH'));
  if(saved) setFooterH(saved);
}

// ---------- 初始化 ----------
async function init(){
  $('btnAdd').onclick = addSelected;
  $('btnAddAll').onclick = addAllFiltered;
  $('btnRemove').onclick = removeSelected;
  $('btnClear').onclick = clearRight;
  $('btnExport').onclick = doExport;
  $('btnExportMove').onclick = doExportAndMove;
  $('btnMove').onclick = doMove;
  $('btnBrowse').onclick = async ()=>{
    const p = await api.chooseDir();
    if(p) $('projectPath').value = p;
  };
  $('btnSetWorkDir').onclick = addTab;
  $('btnClearLog').onclick = ()=> $('log').innerHTML='';
  $('btnRefresh').onclick = load;
  $('search').addEventListener('input', ()=>{ selLeft.clear(); renderLeft(); });

  document.querySelectorAll('#modeGroup input').forEach(r=>{
    r.addEventListener('change', ()=>{
      mode = r.value;
      document.querySelectorAll('#modeGroup label').forEach(l=>
        l.classList.toggle('on', l.dataset.mode===mode));
    });
  });
  document.querySelector('#modeGroup label[data-mode="c"]').classList.add('on');

  bindList($('leftList'), selLeft, n=>{
    if(!rightSet.includes(n)){ rightSet.push(n); renderAll(); }
  });
  bindList($('rightList'), selRight, n=>{
    rightSet = rightSet.filter(x=>x!==n); selRight.delete(n); renderAll();
  });

  try{
    const cfg = await api.getConfig();
    if(cfg && cfg.project_path) $('projectPath').value = cfg.project_path;
  }catch(e){}

  try{
    const saved = localStorage.getItem('tabStates');
    if(saved) tabStates = JSON.parse(saved);
  }catch(e){}

  try{
    // 用 getConfig 一次性取工作目录和页签列表(避免 pywebview 下 get_work_dir/get_tabs 兼容问题)
    const cfg = await api.getConfig();
    workDir = (cfg && cfg.active_work_dir) || '';
    tabs = (cfg && cfg.work_dirs) || [];
    if(!tabs.length && workDir) tabs = [workDir];
    renderWorkDir();
    renderTabs();
    log('已加载页签: ' + tabs.length + ' 个');
  }catch(e){
    log('getConfig 异常: ' + e, 'err');
  }

  restoreState(workDir);

  initDivider();
  initDividerH();

  // 空格键 = 对当前选中项执行双击"移动"操作（左侧选中→添加，右侧选中→移除）
  document.addEventListener('keydown', e=>{
    if(e.code !== 'Space') return;
    const t = e.target;
    const tag = t && t.tagName;
    if(tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || tag === 'BUTTON') return;
    if(selRight.size){
      e.preventDefault();
      const names = [...selRight];
      rightSet = rightSet.filter(n => !names.includes(n));
      selRight.clear();
      renderAll();
    } else if(selLeft.size){
      e.preventDefault();
      const names = [...selLeft];
      names.forEach(n=>{ if(!rightSet.includes(n)) rightSet.push(n); });
      selLeft.clear();
      renderAll();
    }
  });

  await load();
  checkUpdatePrompt();
}

async function checkUpdatePrompt(){
  try{
    const info = await api.checkUpdate();
    if(info && info.has_update){
      const ok = confirm(`发现新版本 v${info.latest}（当前 v${info.current}），是否更新？\n\n更新将下载新版本并自动重启。`);
      if(!ok) return;
      log('开始下载更新...');
      const dl = await api.downloadUpdate(info.download_url);
      if(dl && dl.ok){
        log(dl.log);
        const ap = await api.applyUpdate();
        log(ap.log);
      } else {
        log(dl ? dl.log : '下载失败', 'err');
      }
    }
  }catch(e){}
}

async function load(){
  if(!workDir){ log('请先设置工作目录', 'err'); renderAll(); return; }
  try{
    log('加载配置表列表...');
    const res = await api.listTables();
    const arr = Array.isArray(res) ? res : (res.tables || []);
    allTables = arr;
    renderAll();
    log(`已加载 ${allTables.length} 张配置表`);
  }catch(e){
    log('加载列表失败: ' + e, 'err');
  }
}
// 启动：pywebview(WebView2) 环境等 pywebviewready(js_api 注册完成)，普通浏览器直接启动
let _started = false;
function _boot(){
  if(_started) return;
  _started = true;
  init();
}
if(window.chrome && window.chrome.webview){
  // WebView2(pywebview) 环境：等 js_api 注册完成
  if(window.pywebview && window.pywebview.api && Object.keys(window.pywebview.api).length){
    _boot();
  } else {
    window.addEventListener('pywebviewready', _boot, { once: true });
    setTimeout(_boot, 3000);  // 超时兜底
  }
} else {
  // 普通浏览器(源码模式)：直接启动，走 fetch
  _boot();
}
</script>
