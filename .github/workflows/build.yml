name: Build & Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install openpyxl "pywebview>=5.0,<6" pyinstaller

      - name: Build exe
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name ExportTables --add-data "gui;gui" --add-data "tabtoy.exe;." --collect-all webview app.py

      - name: Upload Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ExportTables.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
